 {id:'mito',n:'Mitochondrie',r:1,s:mitoShape(0,0,-20,1.15)},
 {id:'golgi',n:'Golgi',r:1,s:golgiShape(0,-12,.9)},
 {id:'lyso',n:'Lysosome',r:1,s:`<g transform="scale(2.4)">${lysoShape(0,0)}</g>`},
 {id:'rer',n:'RE rugueux',r:1,s:`${[-10,0,10].map(y=>`<path d="M-20 ${y}Q-10 ${y-6} 0 ${y}T20 ${y}" fill="none" stroke="var(--c-re)" stroke-width="3" stroke-linecap="round"/>`).join('')}${[-16,-6,4,14].map(x=>`<circle cx="${x}" cy="-14" r="2" fill="var(--c-ribo)"/><circle cx="${x+4}" cy="-4" r="2" fill="var(--c-ribo)"/><circle cx="${x}" cy="6" r="2" fill="var(--c-ribo)"/>`).join('')}`},
 {id:'paroi',n:'Paroi',r:1,s:`<rect x="-21" y="-19" width="42" height="38" rx="7" fill="var(--c-wall-fill)" stroke="var(--c-wall)" stroke-width="5"/><rect x="-14" y="-12" width="28" height="24" rx="4" fill="none" stroke="var(--c-membrane)" stroke-width="1.8"/>`},
 {id:'vacuole',n:'Vacuole',r:1,s:`<path d="M-18 -6Q-16 -20 0 -17Q18 -20 19 -2Q20 16 2 17Q-20 18 -18 -6Z" fill="var(--c-vac)" stroke="var(--c-vac-stroke)" stroke-width="3"/>`},
 {id:'rel',n:'RE lisse',r:2,s:`${[-9,3].map(y=>`<path d="M-21 ${y}C-12 ${y-12} -6 ${y+12} 3 ${y}S15 ${y-10} 21 ${y}" fill="none" stroke="var(--c-re)" stroke-width="5" stroke-linecap="round"/>`).join('')}`},
 {id:'centro',n:'Centrosome',r:2,s:`<rect x="-15" y="-5" width="22" height="10" rx="3" fill="none" stroke="var(--c-centro)" stroke-width="3" transform="rotate(-20)"/><rect x="-3" y="-15" width="10" height="22" rx="3" fill="none" stroke="var(--c-centro)" stroke-width="3" transform="rotate(20)"/>`},
 {id:'chloro',n:'Chloroplaste',r:2,s:`<g transform="scale(1.25)">${chloroShape(0,0,-15)}</g>`},
 {id:'atp',n:'ATP',r:2,s:`<circle r="21" fill="var(--c-mito-fill)" stroke="var(--c-mito)" stroke-width="3"/><path d="M3 -15 -8 2h8l-3 13 11-17h-8z" fill="var(--c-mito)"/>`},
 {id:'adn',n:'ADN',r:3,s:`<path d="M-8 -22C14 -11 -14 11 8 22M8 -22C-14 -11 14 11 -8 22" fill="none" stroke="var(--c-nucleus)" stroke-width="3.2" stroke-linecap="round"/>${[-14,-5,5,14].map(y=>`<path d="M${-6+Math.abs(y)/4} ${y}H${6-Math.abs(y)/4}" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>`).join('')}`},
 {id:'canimal',n:'Cellule animale',r:3,s:`<path d="M-22 -2Q-20 -20 0 -20Q22 -21 22 0Q21 20 0 21Q-23 20 -22 -2Z" fill="var(--c-cyto)" stroke="var(--c-membrane)" stroke-width="2.6"/><circle cx="-3" cy="-2" r="8" fill="var(--c-nucleus-fill)" stroke="var(--c-nucleus)" stroke-width="2"/><ellipse cx="11" cy="10" rx="5" ry="2.6" fill="var(--c-mito-fill)" stroke="var(--c-mito)" stroke-width="1.5" transform="rotate(-25 11 10)"/><circle cx="10" cy="-11" r="2.6" fill="var(--c-lyso)"/>`},
 {id:'cplante',n:'Cellule végétale',r:3,s:`<rect x="-22" y="-19" width="44" height="38" rx="5" fill="var(--c-pcyto)" stroke="var(--c-wall)" stroke-width="4"/><rect x="-10" y="-10" width="20" height="20" rx="5" fill="var(--c-vac)" stroke="var(--c-vac-stroke)" stroke-width="1.6"/><ellipse cx="-15" cy="11" rx="4" ry="2" fill="var(--c-chloro)"/><ellipse cx="14" cy="-12" rx="4" ry="2" fill="var(--c-chloro)"/><circle cx="14" cy="10" r="4" fill="var(--c-nucleus-fill)" stroke="var(--c-nucleus)" stroke-width="1.4"/>`},
 {id:'mitodor',n:'Mitochondrie dorée',r:4,s:`<circle r="25" fill="#FFF3C4"/><g transform="translate(0 0) rotate(-20) scale(1.1)"><ellipse rx="22" ry="10" fill="#F4BE32" stroke="#A8700F" stroke-width="2.2"/><polyline points="-16,0 -12,-6 -8,5 -4,-6 0,5 4,-6 8,5 12,-6 16,0" fill="none" stroke="#A8700F" stroke-width="1.6" stroke-linejoin="round"/></g><path d="M18 -20l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#E0A526"/>`}
];
const STKMAP=Object.fromEntries(STK.map(s=>[s.id,s]));
const stkSVG=s=>`<svg viewBox="-30 -30 60 60" aria-hidden="true">${s.s}</svg>`;
const THEMES=[{id:'rose',n:'Framboise',l:'#D2336B',d:'#FF5A91'},{id:'ocean',n:'Océan',l:'#2F6FD1',d:'#6FA2FF'},{id:'chloro',n:'Chlorophylle',l:'#1F8A4C',d:'#5FD68F'},
 {id:'mito',n:'Énergie',l:'#D9731E',d:'#FF9F4F'},{id:'noyau',n:'Noyau',l:'#5A4BC0',d:'#A79BFF'},{id:'golgi',n:'Lagon',l:'#118A7E',d:'#3FD6C6'}];
function isDark(){const t=document.documentElement.dataset.theme;return t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);}
function applyTheme(){const r=document.documentElement.style,th=THEMES.find(x=>x.id===S.theme);
 if(!th||th.id==='rose'){['--accent','--accent-soft'].forEach(p=>r.removeProperty(p));return;}
 const d=isDark(),a=d?th.d:th.l;r.setProperty('--accent',a);r.setProperty('--accent-soft',`color-mix(in srgb,${a} ${d?24:14}%,${d?'#151833':'#fff'})`);}
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);}catch(e){}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function wpick(w){let x=Math.random()*w.reduce((s,v)=>s+v,0);for(let i=0;i<w.length;i++){x-=w[i];if(x<0)return i;}return 0;}
function rollChest(t){const C=CHEST[t],out=[];
 for(let k=0;k<C.rolls;k++){
  const kind=k===0&&t!=='bronze'?'stk':['stk','xp','shield','theme'][wpick(t==='bronze'?[60,25,10,5]:[50,18,16,16])];
  if(kind==='theme'){const locked=THEMES.filter(x=>!S.themes.includes(x.id));
   if(locked.length){const th=locked[rnd(0,locked.length-1)];S.themes.push(th.id);out.push({k:'theme',th});continue;}}
  if(kind==='shield'&&S.shield<3){S.shield++;out.push({k:'shield'});continue;}
  if(kind==='stk'||kind==='theme'||kind==='shield'){
   const r=wpick(C.w)+1,pool=STK.filter(s=>s.r===r);const s=pool[rnd(0,pool.length-1)];
   const isNew=!S.col[s.id];S.col[s.id]=(S.col[s.id]||0)+1;let bonus=0;if(!isNew){bonus=10*s.r;S.xp+=bonus;}
   out.push({k:'stk',s,isNew,bonus});continue;}
  const x=rnd(...C.xp);S.xp+=x;out.push({k:'xp',x});}
 save();return out;}
function rewardHTML(r,i){const st=`style="animation-delay:${.15*i}s"`;
 if(r.k==='stk'){const R=RAR[r.s.r];return `<div class="rwd" style="--rc:${R.c};animation-delay:${.15*i}s"><div class="disc">${stkSVG(r.s)}</div><b>${r.s.n}</b><small>${R.n}${r.isNew?' · Nouveau !':` · doublon +${r.bonus} XP`}</small></div>`;}
 if(r.k==='xp')return `<div class="rwd" ${st}><div class="big">+${r.x}</div><b>XP bonus</b></div>`;
 if(r.k==='shield')return `<div class="rwd" ${st}><div class="disc" style="--rc:#2F6FD1">${shieldSVG()}</div><b>Bouclier de série</b><small style="color:#5B5F86">Sauve ta série si tu rates un jour</small></div>`;
 return `<div class="rwd" ${st}><div class="disc" style="--rc:${r.th.l};background:${r.th.l}"></div><b>Thème ${r.th.n}</b><button class="btn primary" data-usetheme="${r.th.id}" style="min-height:36px;padding:6px 12px;font-size:13px;min-width:0">Utiliser</button></div>`;}
function shieldSVG(){return `<svg viewBox="-30 -30 60 60" aria-hidden="true"><path d="M0 -22 18 -15V0C18 12 9 19 0 23-9 19-18 12-18 0V-15Z" fill="#DCE7FB" stroke="#2F6FD1" stroke-width="3" stroke-linejoin="round"/><path d="M-6 0 -1 5 8 -5" fill="none" stroke="#2F6FD1" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function openChest(i){const ch=S.chests[i];if(!ch)return;S.chests.splice(i,1);const res=rollChest(ch.t);
 const el=document.createElement('div');el.className='copen';el.setAttribute('role','dialog');el.setAttribute('aria-label',CHEST[ch.t].name);
 el.innerHTML=`<div class="stage"><div class="glow"></div>${chestSVG(ch.t)}</div><h2 class="h2">${CHEST[ch.t].name}</h2><div class="rewards" aria-live="polite"></div><button class="btn primary" id="cok" hidden>Super !</button>`;
 document.body.appendChild(el);const cs=$('svg.chest',el);cs.classList.add('shake');
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 setTimeout(()=>{cs.classList.remove('shake');el.classList.add('open');
  setTimeout(()=>{$('.rewards',el).innerHTML=res.map(rewardHTML).join('');$('h2',el).textContent=res.length>1?'Tu as gagné :':'Tu as gagné';
   $$('[data-usetheme]',el).forEach(b=>b.onclick=()=>{S.theme=b.dataset.usetheme;save();applyTheme();b.textContent='Activé';b.disabled=true;});
   const ok=$('#cok',el);ok.hidden=false;ok.focus();},reduce?0:350);},reduce?0:950);
 $('#cok',el).onclick=()=>{el.remove();render();};}

/* reminders */
const notifOK=()=>'Notification' in window;
function notify(title,body){toast(title);
 if(notifOK()&&Notification.permission==='granted'){try{new Notification(title,{body,tag:'revise-cellule'});}catch(e){}}}
function reminderDue(){if(!S.rem.on)return false;const [h,m]=S.rem.time.split(':').map(Number),n=new Date(),t=new Date();t.setHours(h,m,0,0);
 return n>=t&&(S.days[dayKey()]||0)<dq().g&&daysLeft()>=0;}
function reminderText(){const dl=daysLeft(),left=Math.max(0,dq().g-(S.days[dayKey()]||0));
 if(dl===1)return ['Interro demain !','Fais l’examen blanc ce soir pour vérifier que tout tient.'];
 if(dl===0)return ['C’est le jour J','Un petit échauffement avec les cartes mémo avant l’interro ?'];
 return ['C’est l’heure de réviser',`Encore ${left} question${left>1?'s':''} pour ta mission du jour. Interro dans ${dl} jours.`];}
function tickReminder(){if(reminderDue()&&S.rem.last!==dayKey()){S.rem.last=dayKey();save();const [t,b]=reminderText();notify(t,b);if(route==='accueil'&&!sess)render();}}
setInterval(tickReminder,30e3);
function openReminders(){
 const bg=document.createElement('div');bg.className='sheet-bg';
 const paint=()=>{const p=notifOK()?Notification.permission:'none';
  bg.innerHTML=`<div class="sheet" role="dialog" aria-label="Rappels"><div class="grab"></div><div class="wrap view">
  <div class="sec-head"><h2 class="h2">Rappels</h2><button class="iconbtn" id="rx" aria-label="Fermer">${ic('x')}</button></div>
  <div class="switch"><div><b>Rappel chaque jour</b><span>Si ta mission du jour n’est pas finie</span></div><button class="tog" id="ron" role="switch" aria-checked="${S.rem.on}" aria-label="Rappel quotidien"></button></div>
  <div class="switch"><div><b>Heure du rappel</b><span>Interro ${examLabel()}</span></div><input type="time" id="rtime" value="${S.rem.time}" aria-label="Heure du rappel"></div>
  ${p==='granted'?`<div class="nstat ok">Notifications autorisées. Elles apparaissent tant que l’app reste ouverte dans un onglet.</div><button class="btn ghost block" id="rtest">Tester une notification</button>`
   :p==='denied'?`<div class="nstat ko">Les notifications sont bloquées pour cette page. Tes rappels s’afficheront dans l’app, sur l’accueil, dès que tu l’ouvres.</div>`
   :p==='default'?`<button class="btn primary block" id="rperm">${ic('bell')}Autoriser les notifications</button><p class="hint" style="margin:0">Sans autorisation, le rappel s’affiche quand même dans l’app à l’heure choisie.</p>`
   :`<div class="nstat ko">Ce navigateur n’affiche pas de notifications ici. Tes rappels s’afficheront sur l’accueil de l’app.</div>`}
  <p class="hint" style="margin:0">Astuce : garde l’app ouverte dans un onglet, ou ouvre-la chaque soir à l’heure du rappel.</p>
  </div></div>`;
  $('#rx',bg).onclick=()=>{bg.remove();render();};
  $('#ron',bg).onclick=()=>{S.rem.on=!S.rem.on;S.rem.last=null;save();paint();};
  $('#rtime',bg).onchange=e=>{if(e.target.value){S.rem.time=e.target.value;S.rem.last=null;save();}};
  const pb=$('#rperm',bg);if(pb)pb.onclick=async()=>{try{const r=await Notification.requestPermission();if(r==='granted'&&!S.rem.on){S.rem.on=true;save();}}catch(e){}paint();};
  const tb=$('#rtest',bg);if(tb)tb.onclick=()=>{const [t,b]=reminderText();notify(t,b);};};
 paint();document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg){bg.remove();render();}});}

/* home & chests views */
function interroCard(){const dl=daysLeft();
 const cd=dl>1?`J-${dl}`:dl===1?'Demain':dl===0?'Jour J':'Passée';
 const days=[];if(dl>=0){const t=new Date();t.setHours(0,0,0,0);for(let i=Math.max(0,dl-6);i<=dl;i++){const d=new Date(t);d.setDate(t.getDate()+i);days.push({d,dl:dl-i,now:i===0});}}
 return `<div class="interro"><div class="top"><div><div class="lab">Interro de bio</div><div class="when">${examLabel()}</div><button class="chg" id="chgdate">Changer la date</button></div><div class="cd" aria-label="${dl>=0?dl+' jours restants':'interro passée'}">${cd}</div></div>
 <div id="datebox" hidden><input type="date" id="exdate" value="${S.exam}" aria-label="Date de l’interro"></div>
 ${days.length?`<div class="days">${days.map(x=>`<div class="day ${x.now?'now':''} ${x.dl===0?'jj':''}"><b>${x.now?'Auj.':JOURS[x.d.getDay()].slice(0,3)+'.'}</b>${dayTheme(x.dl)}</div>`).join('')}</div>`:'<p style="margin:0;font-size:14px;opacity:.8">Choisis la date de ta prochaine interro pour recevoir un plan jour par jour.</p>'}</div>`;}
function missionsHTML(){const ms=missions(),allDone=ms.every(m=>m.done);
 return `<div class="sec-head"><h2 class="h2">Missions du jour</h2><span class="hint">${allDone?'Toutes réussies !':dayTheme(daysLeft())}</span></div>
 <div class="miss">${ms.map(m=>{const inner=`<span class="ck">${m.done?ic('check'):''}</span><span class="tx">${m.label}</span><span class="rw">${m.prog&&!m.done?m.prog:''}${chestSVG('bronze')}</span>`;
  return m.done?`<div class="mrow done">${inner}</div>`:m.go?`<a class="mrow" href="${m.go}">${inner}</a>`:`<button class="mrow" data-mstart="${m.start}">${inner}</button>`;}).join('')}
 <p class="hint" style="margin:0">Chaque mission rapporte un coffre en bronze. Les trois réussies : un coffre en argent en plus.</p></div>`;}
function bannersHTML(){let h='';
 if(reminderDue()){const [t,b]=reminderText();h+=`<button class="banner" data-mstart="smart">${ic('bell')}<p><b>${t}</b> ${b}</p>${ic('arrow')}</button>`;}
 if(S.chests.length)h+=`<a class="banner gift" href="#coffres" style="text-decoration:none">${chestSVG(S.chests[S.chests.length-1].t)}<p><b>${S.chests.length} coffre${S.chests.length>1?'s':''} à ouvrir</b> Découvre ce qu’il y a dedans.</p>${ic('arrow')}</a>`;
 return h;}
function viewCoffres(){const got=STK.filter(s=>S.col[s.id]).length;
 return `<section class="view"><div><h1 class="h1">Coffres</h1><p class="muted" style="margin:6px 0 0">Gagne des coffres en révisant, puis ouvre-les pour compléter ta collection.</p></div>
 ${S.chests.length?`<div class="chests">${S.chests.map((c,i)=>`<button class="cbox" data-open="${i}">${chestSVG(c.t)}<b>${CHEST[c.t].name}</b><span>${c.why}</span></button>`).join('')}</div>`
  :`<div class="card" style="display:flex;gap:14px;align-items:center"><span style="flex:none;width:72px;opacity:.5">${chestSVG('bronze')}</span><p style="margin:0;font-size:15px">Aucun coffre à ouvrir. Termine une mission du jour pour en gagner un.</p></div>`}
 <div class="statsrow"><div class="card">${ic('spark')}<div><b>${S.xp}</b><span>XP</span></div></div><div class="card">${shieldSVG().replace('<svg ','<svg style="color:inherit" ')}<div><b>${S.shield}/3</b><span>boucliers de série</span></div></div></div>
 <div class="sec-head"><h2 class="h2">Ta collection</h2><span class="hint">${got}/${STK.length}</span></div>
 <div class="coll">${STK.map(s=>S.col[s.id]?`<div class="stk" style="--rc:${RAR[s.r].c}"><div class="disc">${stkSVG(s)}${S.col[s.id]>1?`<i>×${S.col[s.id]}</i>`:''}</div>${s.n}</div>`:`<div class="stk lock"><div class="disc">?</div>${RAR[s.r].n}</div>`).join('')}</div>
 <h2 class="h2">Thèmes de couleur</h2>
 <div class="themes">${THEMES.map(t=>{const own=S.themes.includes(t.id);return `<button class="th ${S.theme===t.id?'on':''} ${own?'':'lock'}" ${own?`data-theme-set="${t.id}"`:'disabled'} style="--sw:${isDark()?t.d:t.l}"><i></i>${own?t.n:'À gagner'}</button>`;}).join('')}</div>
 <div class="card"><b>Comment gagner des coffres</b><ul class="how" style="margin-top:8px">
  <li>Chaque mission du jour : coffre en bronze</li><li>Les 3 missions du jour : coffre en argent</li><li>Session à 90 % ou plus : coffre en bronze (2 par jour)</li><li>Examen blanc à 14/20 ou plus : coffre en or</li><li>Série de 3 jours : argent · 7, 14 et 30 jours : or</li></ul></div>
 </section>`;}
function gainsHTML(){const g=sess&&sess.gains||[];if(!g.length)return '';
 return `<div class="gains"><b>Tu as gagné ${g.length} coffre${g.length>1?'s':''}</b>${g.map(x=>`<div class="g">${chestSVG(x.t)}<span><b>${CHEST[x.t].name}</b> · ${x.why}</span></div>`).join('')}<button class="btn primary block" id="sopen">Ouvrir mes coffres</button></div>`;}
function wireGains(){const b=$('#sopen');if(b)b.onclick=()=>{const z=$('#quiz');z.hidden=true;z.innerHTML='';document.body.style.overflow='';sess=null;if(location.hash==='#coffres')render();else go('coffres');};}
$('#bell').addEventListener('click',openReminders);

window.addEventListener('hashchange',()=>{if(sess)closeLayer();else render();});
applyTheme();render();tickReminder();initCloud();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
</script>
