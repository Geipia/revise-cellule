<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="theme-color" content="#F3F5FA"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Révise"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Révise la Cellule</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Lilita+One&display=swap">
<style>
/* Layout: app shell — sticky top bar, one 600px column, fixed bottom tab bar; sessions open as a full-screen layer */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface-2:#ECEFF7; --ink:#1C1D4A; --muted:#5B5F86; --line:#DADEEC;
  --accent:#D2336B; --accent-ink:#FFFFFF; --accent-soft:#FBE4ED;
  --plant:#23845A; --plant-soft:#DDF1E6;
  --good:#178A57; --good-soft:#DDF3E8; --bad:#C93A3A; --bad-soft:#FBE3E3; --warn:#A86F08; --warn-soft:#FBF0D6;
  --c-cyto:#F6EEF7; --c-membrane:#9B4F96; --c-nucleus:#4B3F9E; --c-nucleus-fill:#DCD8F5; --c-mito:#D9731E; --c-mito-fill:#FCE3CC;
  --c-re:#2F6FD1; --c-ribo:#1C1D4A; --c-golgi:#139C8F; --c-lyso:#D2336B; --c-lyso-fill:#F9D3E1; --c-centro:#7A6420;
  --c-wall:#7A9A3A; --c-wall-fill:#EAF2D9; --c-vac:#D9ECFA; --c-vac-stroke:#5B9BD5; --c-chloro:#1F8A4C; --c-chloro-fill:#BFE7C9; --c-pcyto:#F1F6EC;
  --shadow:0 1px 2px rgba(28,29,74,.06), 0 8px 24px rgba(28,29,74,.07);
  --f-display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:18px; --tab-h:64px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0C0E1D; --surface:#151833; --surface-2:#1D2143; --ink:#E8E9F7; --muted:#A3A7CC; --line:#2A2E55;
  --accent:#FF5A91; --accent-ink:#1A0610; --accent-soft:#3B1529; --plant:#4FCB8C; --plant-soft:#123224;
  --good:#3CD48A; --good-soft:#12301F; --bad:#FF7A7A; --bad-soft:#3A1717; --warn:#F3B640; --warn-soft:#3A2C0E;
  --c-cyto:#1E1B3A; --c-membrane:#D58BD0; --c-nucleus:#A79BFF; --c-nucleus-fill:#2C2766; --c-mito:#FF9F4F; --c-mito-fill:#4A2A12;
  --c-re:#6FA2FF; --c-ribo:#E8E9F7; --c-golgi:#3FD6C6; --c-lyso:#FF5A91; --c-lyso-fill:#4A1730; --c-centro:#E0C77A;
  --c-wall:#A7C766; --c-wall-fill:#1C2A12; --c-vac:#14304A; --c-vac-stroke:#6FB4F0; --c-chloro:#5FD68F; --c-chloro-fill:#164A2A; --c-pcyto:#17251C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0C0E1D; --surface:#151833; --surface-2:#1D2143; --ink:#E8E9F7; --muted:#A3A7CC; --line:#2A2E55;
  --accent:#FF5A91; --accent-ink:#1A0610; --accent-soft:#3B1529; --plant:#4FCB8C; --plant-soft:#123224;
  --good:#3CD48A; --good-soft:#12301F; --bad:#FF7A7A; --bad-soft:#3A1717; --warn:#F3B640; --warn-soft:#3A2C0E;
  --c-cyto:#1E1B3A; --c-membrane:#D58BD0; --c-nucleus:#A79BFF; --c-nucleus-fill:#2C2766; --c-mito:#FF9F4F; --c-mito-fill:#4A2A12;
  --c-re:#6FA2FF; --c-ribo:#E8E9F7; --c-golgi:#3FD6C6; --c-lyso:#FF5A91; --c-lyso-fill:#4A1730; --c-centro:#E0C77A;
  --c-wall:#A7C766; --c-wall-fill:#1C2A12; --c-vac:#14304A; --c-vac-stroke:#6FB4F0; --c-chloro:#5FD68F; --c-chloro-fill:#164A2A; --c-pcyto:#17251C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-appearance:none;appearance:none}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15;letter-spacing:-.01em}
sub{font-size:.72em;line-height:0}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid transparent}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:18px}
.brand svg{width:28px;height:28px}
.streak{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.streak svg{width:16px;height:16px;color:var(--warn)}

main{padding-block:8px calc(var(--tab-h) + 28px)}
.view{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.h1{font-size:clamp(28px,7.5vw,36px);font-weight:800}
.h2{font-size:21px;font-weight:800}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.sec-head a,.link{color:var(--accent);font-weight:600;font-size:14px;text-decoration:none}

/* cards & buttons */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;transition:transform .12s ease, background .2s}
.btn:active{transform:scale(.97)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

/* hero */
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.ring .val b{font-family:var(--f-display);font-size:26px;font-weight:800;line-height:1}
.ring .val span{font-size:11px;color:var(--muted)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:18px;border-radius:var(--r);background:var(--ink);color:var(--bg);box-shadow:var(--shadow);transition:transform .12s}
.cta:active{transform:scale(.98)}
.cta .ico{flex:none;width:48px;height:48px;border-radius:14px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.cta .ico svg{width:24px;height:24px}
.cta b{display:block;font-family:var(--f-display);font-size:19px}
.cta span{font-size:14px;opacity:.75}
.cta .go{margin-left:auto;width:22px;height:22px;flex:none}
.plan{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:14px;padding:14px}
.plan svg{flex:none;width:22px;height:22px;color:var(--accent);margin-top:1px}
.plan p{margin:0;font-size:15px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);min-width:0;transition:transform .12s}
.mode:active{transform:scale(.97)}
.mode .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--accent)}
.mode .mi svg{width:20px;height:20px}
.mode b{font-size:16px}
.mode span{font-size:13px;color:var(--muted);line-height:1.35}

/* topic rows */
.tlist{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);text-align:left;width:100%;text-decoration:none;color:inherit}
.trow .num{width:36px;height:36px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.trow .num.read{background:var(--good-soft);color:var(--good)}
.trow .num.read svg{width:18px;height:18px}
.trow .nm{min-width:0}
.trow .nm b{display:block;font-size:15.5px;line-height:1.25}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.bar span{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .6s ease}
.pill{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums}
.p-new{background:var(--surface-2);color:var(--muted)}
.p-weak{background:var(--bad-soft);color:var(--bad)}
.p-mid{background:var(--warn-soft);color:var(--warn)}
.p-ok{background:var(--good-soft);color:var(--good)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* course */
.lesson{display:flex;flex-direction:column;gap:16px}
.lesson h3{font-size:19px;font-weight:800;margin-top:8px}
.lesson p,.lesson ul{margin:0}
.lesson ul{padding-left:20px;display:flex;flex-direction:column;gap:5px}
.lesson li::marker{color:var(--accent)}
.box{border-radius:14px;padding:14px 16px;background:var(--surface-2)}
.box .eyebrow{display:block;margin-bottom:6px}
.box.key{background:var(--accent-soft)}
.box.key .eyebrow{color:var(--accent)}
.box.plant{background:var(--plant-soft)}
.box.plant .eyebrow{color:var(--plant)}
.box.warn{background:var(--warn-soft)}
.box.warn .eyebrow{color:var(--warn)}
.eq{font-family:var(--f-mono);font-size:15px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto;white-space:nowrap;text-align:center}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.flow{display:flex;align-items:stretch;gap:8px;flex-wrap:wrap}
.flow .fbx{flex:1 1 120px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center;font-size:14px}
.flow .fbx b{display:block;font-family:var(--f-mono);font-size:13px;margin-bottom:2px}
.flow .fbx.mid{background:var(--c-mito-fill);border-color:var(--c-mito)}
.flow .arr{align-self:center;color:var(--muted)}
.tbl{overflow-x:auto;border-radius:14px;border:1px solid var(--line)}
.tbl table{border-collapse:collapse;width:100%;font-size:14.5px;min-width:320px}
.tbl th,.tbl td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.tbl th{background:var(--surface-2);font-weight:700;font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.yes{color:var(--good);font-weight:700}.no{color:var(--bad);font-weight:700}
.figure{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.figure svg{width:100%;height:auto;display:block}
.figcap{font-size:13.5px;color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.legend button{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:600}
.legend button i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend button.on{background:var(--accent);color:var(--accent-ink)}
.info{min-height:64px;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:14.5px}
.info b{display:block}
.sec-nav{display:flex;gap:10px}
.sec-nav .btn{flex:1;font-size:14px}
.lesson-head{display:flex;flex-direction:column;gap:8px}

/* svg cell */
.org{cursor:pointer;transition:opacity .25s, filter .25s}
.dim .org:not(.hl){opacity:.22}
.org.hl{filter:drop-shadow(0 0 5px var(--accent))}
.org.hl .shape{stroke:var(--accent)!important}
.svgt{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
.svgb{font-family:var(--f-mono);font-size:12px;fill:var(--ink)}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .wrap{display:grid;grid-template-columns:repeat(4,1fr);height:var(--tab-h)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--accent)}

/* quiz layer */
.quiz{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.qtop{display:flex;align-items:center;gap:12px;padding-block:12px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);flex:none}
.iconbtn svg{width:20px;height:20px}
.qbar{flex:1;height:10px;border-radius:10px;background:var(--surface-2);overflow:hidden}
.qbar span{display:block;height:100%;background:var(--accent);border-radius:10px;transition:width .4s ease}
.qcount{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qwrap{display:flex;flex-direction:column;gap:18px;padding-top:6px}
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{font-size:12.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow)}
.chip.warn{background:var(--warn-soft);color:var(--warn);box-shadow:none}
.chip.exam{background:var(--ink);color:var(--bg);box-shadow:none}
.diff{display:inline-flex;gap:3px;margin-left:auto;align-items:center;font-size:12px;color:var(--muted)}
.diff i{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.diff i.on{background:var(--accent)}
.qtext{font-size:clamp(21px,5.6vw,25px);font-weight:800;line-height:1.25}
.qkind{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;min-height:56px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;font-size:16px;font-weight:500;transition:transform .1s, border-color .2s, background .2s}
.choice:active{transform:scale(.985)}
.choice .k{flex:none;width:28px;height:28px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.choice.sel{border-color:var(--accent)}
.choice.sel .k{background:var(--accent);color:var(--accent-ink)}
.choice.ok{border-color:var(--good);background:var(--good-soft)}
.choice.ok .k{background:var(--good);color:var(--surface)}
.choice.ko{border-color:var(--bad);background:var(--bad-soft)}
.choice.ko .k{background:var(--bad);color:var(--surface)}
.choice.miss{border-color:var(--good);border-style:dashed}
.locked .choice,.locked .mbtn{pointer-events:none}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .choice{justify-content:center;font-weight:700;font-size:18px;min-height:64px}
.inp{display:flex;flex-direction:column;gap:10px}
.inp input{width:100%;padding:15px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface);font-size:17px;outline:none}
.inp input:focus{border-color:var(--accent)}
.inp input.ok{border-color:var(--good);background:var(--good-soft)}
.inp input.ko{border-color:var(--bad);background:var(--bad-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mbtn{min-height:58px;padding:10px 12px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:2px solid transparent;font-size:14.5px;font-weight:600;text-align:left;line-height:1.3;transition:border-color .2s, background .2s}
.mbtn.sel{border-color:var(--ink)}
.mbtn[data-p]{border-color:var(--pc)}
.mbtn[data-p]::before{content:attr(data-p);display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;background:var(--pc);color:var(--surface);font-size:11px;font-family:var(--f-mono);margin-right:6px;vertical-align:1px}
.mbtn.ok{background:var(--good-soft);border-color:var(--good)}
.mbtn.ko{background:var(--bad-soft);border-color:var(--bad)}
.hint{font-size:13.5px;color:var(--muted)}
.qactions{display:flex;gap:10px;align-items:center}
.qactions .btn{flex:1}
.skip{font-size:14px;font-weight:600;color:var(--muted);padding:12px;text-decoration:underline;text-underline-offset:3px}
.fb{border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;animation:rise .3s ease}
.fb.good{background:var(--good-soft)} .fb.bad{background:var(--bad-soft)}
.fbhead{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:19px}
.fb.good .fbhead{color:var(--good)} .fb.bad .fbhead{color:var(--bad)}
.fbhead svg{width:22px;height:22px}
.fb p{margin:0;font-size:15px}
.lvl{font-size:13.5px;font-weight:700;color:var(--accent);display:flex;gap:6px;align-items:center}
.lvl svg{width:16px;height:16px}
.fbact{display:flex;gap:10px;flex-wrap:wrap}
.fbact .btn{flex:1 1 140px}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}

/* flashcard */
.fc{perspective:1200px;min-height:280px}
.fc-in{position:relative;min-height:280px;transition:transform .5s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow)}
.fc-front{background:var(--surface)}
.fc-back{background:var(--ink);color:var(--bg);transform:rotateY(180deg)}
.fc-face .big{font-family:var(--f-display);font-size:24px;font-weight:800;line-height:1.25}
.fc-face .eyebrow{color:inherit;opacity:.65}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate .btn{font-size:14px;padding:10px 6px}
.rate .r0{background:var(--bad-soft);color:var(--bad)}
.rate .r1{background:var(--warn-soft);color:var(--warn)}
.rate .r2{background:var(--good-soft);color:var(--good)}

/* summary */
.sum-top{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:12px}
.sum-top .ring{width:150px;height:150px}
.sum-top .ring .val b{font-size:38px}
.delta{display:flex;flex-direction:column;gap:10px}
.drow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.drow .bar{grid-column:1/-1;margin-top:2px;position:relative}
.drow small{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-size:14.5px;border-left:4px solid var(--bad)}
.rv.okk{border-left-color:var(--good)}
.rv p{margin:0}
.rv .a{color:var(--muted);margin-top:4px}

/* sheet */
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(10,10,30,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:640px;max-height:86vh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 0 calc(env(safe-area-inset-bottom,0px) + 24px);animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
@keyframes up{from{transform:translateY(40%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 16px);transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;font-size:14.5px;max-width:calc(100% - 32px);box-shadow:var(--shadow);animation:rise .25s}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--bad-soft);border-radius:14px;padding:14px}
.confirm p{margin:0;font-size:14.5px}
.confirm div{display:flex;gap:8px}
.confirm .btn{flex:1;min-height:42px;font-size:14px}
.danger{background:var(--bad);color:var(--surface)}
.spark{display:flex;align-items:flex-end;gap:5px;height:70px}
.spark i{flex:1;background:var(--accent);border-radius:4px 4px 2px 2px;min-height:4px;opacity:.85}
.spark i.last{opacity:1;background:var(--ink)}
.empty{font-size:14px;color:var(--muted)}
/* interro, missions, coffres, rappels */
.tabbar .wrap{grid-template-columns:repeat(5,1fr)}
.tab{position:relative}
.tab .badge{position:absolute;top:6px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.tright{display:flex;align-items:center;gap:8px}
.bell{width:36px;height:36px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;position:relative}
.bell svg{width:18px;height:18px}
.bell.on::after{content:"";position:absolute;top:7px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--surface)}
.interro{background:var(--ink);color:var(--bg);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.interro .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.interro .cd{font-family:var(--f-display);font-weight:800;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.interro .cd small{font-size:15px;font-weight:600;opacity:.75;margin-left:4px}
.interro .lab{font-size:13px;opacity:.75}
.interro .when{font-family:var(--f-display);font-weight:800;font-size:20px;text-transform:capitalize}
.interro .chg{color:var(--bg);opacity:.8;font-size:13px;font-weight:600;text-decoration:underline;padding:4px 0}
.interro input[type=date]{background:var(--surface);color:var(--ink);border:0;border-radius:10px;padding:8px 10px;font-size:16px}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -4px;padding:0 4px}
.days::-webkit-scrollbar{display:none}
.day{flex:1 1 0;min-width:52px;border-radius:12px;padding:8px 6px;text-align:center;background:color-mix(in srgb,var(--bg) 12%,transparent);font-size:12px;line-height:1.25}
.day b{display:block;font-size:13px;text-transform:capitalize}
.day.now{background:var(--accent);color:var(--accent-ink)}
.day.jj{outline:2px solid var(--accent);outline-offset:-2px}
.miss{display:flex;flex-direction:column;gap:8px}
.mrow{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);text-align:left;width:100%;color:var(--ink);text-decoration:none}
.mrow .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.mrow .ck svg{width:16px;height:16px}
.mrow.done .ck{background:var(--good);border-color:var(--good);color:var(--surface)}
.mrow.done .tx{color:var(--muted);text-decoration:line-through}
.mrow .tx{flex:1;font-weight:600;font-size:15px}
.mrow .rw{flex:none;display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mrow .rw svg{width:30px;height:26px}
.banner{display:flex;gap:12px;align-items:center;border-radius:14px;padding:12px 14px;background:var(--warn-soft);color:var(--ink);width:100%;text-align:left}
.banner svg{flex:none;width:22px;height:22px;color:var(--warn)}
.banner p{margin:0;font-size:14.5px;flex:1}
.banner.gift{background:var(--accent-soft)}
.banner.gift svg{color:var(--accent);width:34px;height:30px}
.chest{overflow:visible}
.chests{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.cbox{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);text-align:center}
.cbox svg{width:96px;height:84px}
.cbox b{font-size:14.5px}
.cbox span{font-size:12px;color:var(--muted);line-height:1.3}
.cbox:active{transform:scale(.97)}
.cbox:hover .chest{animation:wob .6s}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px}
.stk{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;font-size:11.5px;font-weight:600;line-height:1.2}
.stk .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);border:3px solid var(--rc,var(--line));position:relative}
.stk .disc svg{width:56px;height:56px}
.stk .disc i{position:absolute;bottom:-4px;right:-4px;font-style:normal;background:var(--ink);color:var(--bg);font-size:11px;border-radius:9px;padding:1px 6px;font-weight:800}
.stk.lock .disc{background:var(--surface-2);box-shadow:none;border-style:dashed;border-color:var(--line);color:var(--muted);font-family:var(--f-display);font-size:24px;font-weight:800}
.stk.lock{color:var(--muted)}
.themes{display:flex;flex-wrap:wrap;gap:10px}
.th{display:flex;align-items:center;gap:8px;padding:8px 12px 8px 8px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-size:14px;font-weight:600;min-height:44px}
.th i{width:26px;height:26px;border-radius:50%;background:var(--sw)}
.th.on{outline:2.5px solid var(--accent)}
.th.lock{opacity:.45;box-shadow:none;background:var(--surface-2)}
.statsrow{display:flex;gap:10px;flex-wrap:wrap}
.statsrow .card{flex:1 1 140px;padding:14px;display:flex;align-items:center;gap:10px}
.statsrow svg{width:28px;height:28px;color:var(--accent);flex:none}
.statsrow b{font-size:20px;font-family:var(--f-display);display:block;line-height:1.1}
.statsrow span{font-size:12.5px;color:var(--muted)}
.how{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14.5px}
.copen{position:fixed;inset:0;z-index:90;background:rgba(8,8,26,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;color:#fff;animation:fade .2s;overflow-y:auto}
.copen .stage{position:relative;width:220px;height:190px;display:grid;place-items:center;flex:none}
.copen .stage svg.chest{width:200px;height:174px;position:relative;z-index:1}
.copen .glow{position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.85),rgba(255,180,80,.25) 45%,transparent 70%);transform:scale(.2);opacity:0;transition:transform .6s cubic-bezier(.2,.8,.2,1),opacity .4s}
.copen.open .glow{transform:scale(1);opacity:1}
.copen .chest.shake{animation:shake .45s infinite}
.chest .lid{transition:transform .5s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:0% 100%}
.chest .lock{transition:opacity .2s}
.copen.open .chest .lid{transform:translate(-2px,-20px) rotate(-16deg)}
.copen.open .chest .lock{opacity:0}
.copen h2{color:#fff;text-align:center}
.rewards{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;max-width:520px;min-height:10px}
.rwd{width:150px;background:#fff;color:#1C1D4A;border-radius:16px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1) both;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.rwd .disc{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--rc,#ccc);background:#F6F7FC}
.rwd .disc svg{width:56px;height:56px}
.rwd b{font-size:14.5px;line-height:1.2}
.rwd small{font-size:12px;font-weight:700;color:var(--rc,#5B5F86)}
.rwd .big{font-family:var(--f-display);font-weight:800;font-size:30px;color:#D2336B}
.copen .btn{min-width:200px}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg) translateY(-2px)}75%{transform:rotate(6deg) translateY(-2px)}}
@keyframes wob{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}60%{transform:rotate(4deg)}}
@keyframes pop{from{transform:scale(.4) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-height:56px}
.switch b{font-size:15px}
.switch span{display:block;font-size:13px;color:var(--muted)}
.tog{flex:none;width:52px;height:30px;border-radius:15px;background:var(--line);position:relative;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-checked=true]{background:var(--accent)}
.tog[aria-checked=true]::after{transform:translateX(22px)}
.switch input[type=time]{background:var(--surface-2);color:var(--ink);border:0;border-radius:10px;padding:8px 10px;font-size:16px;font-weight:700}
.nstat{font-size:13.5px;border-radius:12px;padding:10px 12px;background:var(--surface-2)}
.nstat.ok{background:var(--good-soft);color:var(--good)}
.nstat.ko{background:var(--warn-soft)}
.gains{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:var(--r);padding:14px}
.gains .g{display:flex;align-items:center;gap:10px;font-size:14.5px}
.gains .g svg{width:34px;height:30px;flex:none}
/* game home */
.game{gap:16px}
.gfont,.lv,.bname,.cdn,.play span,.gm b,.bub,.qh b{font-family:"Lilita One",var(--f-display);font-weight:400;letter-spacing:.01em}
.hud{display:flex;align-items:center;gap:12px}
.lvl{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:16px;padding:8px 12px 8px 8px;box-shadow:0 4px 0 var(--line)}
.lv{flex:none;width:52px;height:52px;border-radius:14px;background:linear-gradient(160deg,#7C5CFF,#4B2FD0);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1;box-shadow:inset 0 -4px 0 rgba(0,0,0,.25)}
.lv small{font-family:var(--f-body);font-size:10px;font-weight:700;opacity:.85;text-transform:uppercase}
.lvt{flex:1}
.xpbar{height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.08)}
.xpbar span{display:block;height:100%;border-radius:7px;background:linear-gradient(90deg,#FFC531,#FF9A1F);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.lvt small{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.hchest{flex:none;position:relative;width:68px;height:68px;border-radius:16px;background:var(--surface);box-shadow:0 4px 0 var(--line);display:grid;place-items:center}
.hchest svg{width:50px;height:44px}
.hchest.has svg{animation:wob 1.6s ease-in-out infinite}
.hchest b{position:absolute;top:-6px;right:-6px;min-width:24px;height:24px;border-radius:12px;background:#FF3B5C;color:#fff;font-size:13px;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 3px var(--bg)}
.arena{position:relative;overflow:hidden;border-radius:22px;padding:16px 16px 14px;color:#fff;background:radial-gradient(120% 70% at 50% 100%,#5A2C9E 0%,transparent 60%),linear-gradient(180deg,#1A1240 0%,#2A1B66 100%);box-shadow:0 6px 0 #120C30;display:flex;flex-direction:column;gap:6px}
.arena::before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 20%,#fff8,transparent),radial-gradient(1.5px 1.5px at 80% 14%,#fff9,transparent),radial-gradient(2px 2px at 66% 40%,#fff5,transparent),radial-gradient(1.5px 1.5px at 30% 60%,#fff6,transparent),radial-gradient(2px 2px at 90% 70%,#fff5,transparent);pointer-events:none}
.atop{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;background:#FF3B5C;border-radius:6px;padding:2px 7px}
.bname{font-size:26px;line-height:1.1;margin-top:4px}
.adate{color:#CFC6FF;font-size:13px;font-weight:600;padding:2px 0;text-transform:capitalize;min-height:32px}
.cdn{flex:none;font-size:30px;line-height:1;background:#FFC531;color:#3A2300;border-radius:14px;padding:10px 12px;box-shadow:0 4px 0 #B07A00;transform:rotate(3deg)}
.cdn.hot{background:#FF3B5C;color:#fff;box-shadow:0 4px 0 #A3122E;animation:pulse 1.2s ease-in-out infinite}
.arena input[type=date]{position:relative;background:#fff;color:#1C1D4A;border:0;border-radius:10px;padding:8px 10px;font-size:16px}
.bossbox{position:relative;height:clamp(170px,48vw,220px);display:grid;place-items:center}
.boss{height:100%;width:auto;max-width:100%;overflow:visible}
.boss .bob{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.boss .pupil{animation:look 5s ease-in-out infinite}
.hp{position:relative;display:flex;align-items:center;gap:8px}
.hpl{font-size:12px;font-weight:800;background:#FF3B5C;border-radius:6px;padding:2px 6px}
.hpbar{flex:1;height:18px;border-radius:9px;background:#0E0A26;border:2px solid #fff3;overflow:hidden}
.hpbar span{display:block;height:100%;background:linear-gradient(90deg,#FF3B5C,#FF7A59);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);transition:width .6s}
.hp b{font-family:"Lilita One",var(--f-display);font-weight:400;font-size:20px;min-width:38px;text-align:right;font-variant-numeric:tabular-nums}
.ahint{position:relative;margin:2px 0 0;font-size:13px;color:#CFC6FF}
.play{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;padding:14px 18px 16px;border-radius:20px;background:linear-gradient(180deg,#3DDC84,#1FB866);color:#fff;box-shadow:0 7px 0 #138A4A,0 12px 24px rgba(31,184,102,.35);transition:transform .08s,box-shadow .08s}
.play span{font-size:34px;line-height:1;text-transform:uppercase;text-shadow:0 3px 0 rgba(0,0,0,.18)}
.play small{font-size:13.5px;font-weight:700;opacity:.92}
.play:active{transform:translateY(6px);box-shadow:0 1px 0 #138A4A}
.tip{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--muted)}
.tip svg{flex:none;width:20px;height:20px;color:#FFB020}
.tip p{margin:0}
.quests{background:var(--surface);border-radius:20px;padding:14px;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.qh{display:flex;justify-content:space-between;align-items:center}
.qh b{font-size:20px}
.qh span{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.qseg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:4px}
.qseg i{height:8px;border-radius:4px;background:var(--surface-2)}
.qseg i.on{background:#3DDC84}
.qrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px;border-radius:14px;background:var(--surface-2);color:var(--ink);text-decoration:none;min-height:56px}
.qrow .ck{flex:none;width:26px;height:26px;border-radius:8px;border:2.5px solid var(--line);display:grid;place-items:center;background:var(--surface)}
.qrow .ck svg{width:16px;height:16px}
.qrow.done .ck{background:#3DDC84;border-color:#1FB866;color:#fff}
.qrow.done .tx{color:var(--muted);text-decoration:line-through}
.qrow .tx{flex:1;font-weight:700;font-size:14.5px;line-height:1.3;display:flex;flex-direction:column;gap:6px}
.mini{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mini span{display:block;height:100%;background:#FFB020}
.qrow .rw{flex:none;display:flex;align-items:center;gap:4px}
.qrow .rw em{font-style:normal;font-size:12px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.qrow .rw svg{width:30px;height:26px}
.qrow.done .rw svg{opacity:.35}
.qfoot{margin:2px 0 0;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.qfoot svg{width:24px;height:21px}
.gmodes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gm{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px;border-radius:18px;color:#fff;text-align:left;text-decoration:none;min-height:112px;transition:transform .08s,box-shadow .08s}
.gm svg{width:28px;height:28px;margin-bottom:auto;opacity:.95}
.gm b{font-size:19px;line-height:1.1;margin-top:8px}
.gm span{font-size:12.5px;font-weight:600;opacity:.9;line-height:1.3}
.gm:active{transform:translateY(4px)}
.m1{background:#F2475B;box-shadow:0 5px 0 #A82334}.m1:active{box-shadow:0 1px 0 #A82334}
.m2{background:#2F80ED;box-shadow:0 5px 0 #1B57A8}.m2:active{box-shadow:0 1px 0 #1B57A8}
.m3{background:#13A88A;box-shadow:0 5px 0 #0B7560}.m3:active{box-shadow:0 1px 0 #0B7560}
.m4{background:#7C4DFF;box-shadow:0 5px 0 #4F2BBF}.m4:active{box-shadow:0 1px 0 #4F2BBF}
.maph{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.map{position:relative;margin:0 -4px}
.map .trail{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translateX(-50%);width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--ink)}
.bub{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;color:#fff;background:#B3B8D6;box-shadow:0 6px 0 #8A8FB0,inset 0 -5px 0 rgba(0,0,0,.12)}
.node.go .bub{background:linear-gradient(180deg,#9B7BFF,#6C47F5);box-shadow:0 6px 0 #4A2DB8,inset 0 -5px 0 rgba(0,0,0,.12)}

.node.rec .bub{outline:4px solid #3DDC84;outline-offset:4px;animation:pulse 1.4s ease-in-out infinite}

<script>
"use strict";
/* ---------- helpers ---------- */

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

const ICON={
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

 cards:'<rect x="3" y="6" width="13" height="15" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v13"/>',

};
const ic=(n,extra='')=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" ${extra}>${ICON[n]}</svg>`;
const G='C<sub>6</sub>H<sub>12</sub>O<sub>6</sub>', O2='O<sub>2</sub>', CO2='CO<sub>2</sub>', H2O='H<sub>2</sub>O';

/* ---------- course ---------- */
const TOPICS=[
 {id:'organisation',short:'Organisation',name:'Organisation générale'},
 {id:'membrane',short:'Membrane',name:'La membrane plasmique'},
 {id:'cytoplasme',short:'Cytoplasme',name:'Cytoplasme & hyaloplasme'},
 {id:'mitochondries',short:'Mitochondries',name:'Mitochondries & énergie'},
 {id:'reticulum',short:'Réticulum',name:'Réticulum & ribosomes'},
 {id:'golgi',short:'Golgi',name:'L’appareil de Golgi'},

];
const TMAP=Object.fromEntries(TOPICS.map(t=>[t.id,t]));

const ORG={
 membrane:{name:'Membrane plasmique',role:'Enveloppe la cellule, assure les échanges avec l’extérieur avec une perméabilité sélective.',t:'membrane',col:'--c-membrane'},
 noyau:{name:'Noyau',role:'Contient le matériel génétique. Il ne fait pas partie du cytoplasme.',t:'organisation',col:'--c-nucleus'},
 mito:{name:'Mitochondrie',role:'Siège de la respiration cellulaire, produit l’ATP : la « centrale énergétique ».',t:'mitochondries',col:'--c-mito'},
 rer:{name:'Réticulum endoplasmique rugueux',role:'Feuillets couverts de ribosomes : synthèse des protéines.',t:'reticulum',col:'--c-re'},
 rel:{name:'Réticulum endoplasmique lisse',role:'Sans ribosomes : synthèse des lipides grâce aux enzymes de sa membrane.',t:'reticulum',col:'--c-re'},
 golgi:{name:'Appareil de Golgi',role:'Dictyosomes (sacs aplatis empilés) qui emballent les produits de synthèse dans des vésicules.',t:'golgi',col:'--c-golgi'},
 lyso:{name:'Lysosome',role:'« Poubelle » de la cellule : ses enzymes décomposent aliments et corps étrangers.',t:'lysosomes',col:'--c-lyso'},
 centro:{name:'Centrosome',role:'Organite du cytoplasme cité dans ton cours (son rôle n’y est pas détaillé).',t:'cytoplasme',col:'--c-centro'},
 paroi:{name:'Enveloppe (paroi)',role:'Résistante, non vivante, rigide et élastique : elle renforce la membrane.',t:'vegetale',col:'--c-wall'},
 vacuole:{name:'Vacuole',role:'Remplie d’eau, de sels minéraux et de glucides simples : rigidité et élasticité de la plante.',t:'vegetale',col:'--c-vac-stroke'},

};

/* ---------- diagrams ---------- */
const f=n=>Math.round(n*10)/10;
function mitoShape(x,y,rot,s=1){return `<g class="org" data-org="mito" transform="translate(${x} ${y}) rotate(${rot}) scale(${s})"><ellipse class="shape" rx="22" ry="10" fill="var(--c-mito-fill)" stroke="var(--c-mito)" stroke-width="2.2"/><polyline points="-16,0 -12,-6 -8,5 -4,-6 0,5 4,-6 8,5 12,-6 16,0" fill="none" stroke="var(--c-mito)" stroke-width="1.4" stroke-linejoin="round"/></g>`;}
function lysoShape(x,y){return `<g class="org" data-org="lyso"><circle class="shape" cx="${x}" cy="${y}" r="7.5" fill="var(--c-lyso-fill)" stroke="var(--c-lyso)" stroke-width="2"/><circle cx="${x-2}" cy="${y-2}" r="1.3" fill="var(--c-lyso)"/><circle cx="${x+2.5}" cy="${y+1}" r="1.3" fill="var(--c-lyso)"/><circle cx="${x-1}" cy="${y+3}" r="1.1" fill="var(--c-lyso)"/></g>`;}
function chloroShape(x,y,rot){return `<g class="org" data-org="chloro" transform="translate(${x} ${y}) rotate(${rot})"><ellipse class="shape" rx="18" ry="8" fill="var(--c-chloro-fill)" stroke="var(--c-chloro)" stroke-width="2"/><path d="M-9,-4v8M-3,-4.5v9M3,-4.5v9M9,-4v8" stroke="var(--c-chloro)" stroke-width="1.6" stroke-linecap="round"/></g>`;}
function golgiShape(x,y,s=1){let p='';for(let i=0;i<4;i++){p+=`<path class="shape" d="M${x-24*s+i*2*s},${y+i*7*s} Q${x},${y-9*s+i*7*s} ${x+24*s-i*2*s},${y+i*7*s}" fill="none" stroke="var(--c-golgi)" stroke-width="${4.5*s}" stroke-linecap="round"/>`;}
 p+=`<circle cx="${x+30*s}" cy="${y+5*s}" r="${3.4*s}" fill="none" stroke="var(--c-golgi)" stroke-width="${1.8*s}"/><circle cx="${x+27*s}" cy="${y+22*s}" r="${3*s}" fill="none" stroke="var(--c-golgi)" stroke-width="${1.8*s}"/><circle cx="${x-30*s}" cy="${y+16*s}" r="${3*s}" fill="none" stroke="var(--c-golgi)" stroke-width="${1.8*s}"/>`;
 return `<g class="org" data-org="golgi">${p}</g>`;}
function svgAnimal(){
 const cx=150,cy=120; let rer='';
 [46,55,64].forEach(r=>{const a0=-55*Math.PI/180,a1=70*Math.PI/180;
  rer+=`<path class="shape" d="M${f(cx+r*Math.cos(a0))},${f(cy+r*Math.sin(a0))} A${r},${r} 0 0 1 ${f(cx+r*Math.cos(a1))},${f(cy+r*Math.sin(a1))}" fill="none" stroke="var(--c-re)" stroke-width="3.6" stroke-linecap="round"/>`;
  for(let a=-50;a<=66;a+=12){const t=a*Math.PI/180,rr=r+3.6;rer+=`<circle cx="${f(cx+rr*Math.cos(t))}" cy="${f(cy+rr*Math.sin(t))}" r="1.5" fill="var(--c-ribo)"/>`;}
 });
 return `<svg viewBox="0 0 320 240" role="img" aria-label="Schéma d’une cellule animale">
 <g class="org" data-org="membrane"><path class="shape" d="M30,120 C30,50 90,18 165,18 C245,18 292,60 292,118 C292,185 240,222 160,222 C80,222 30,190 30,120Z" fill="var(--c-cyto)" stroke="var(--c-membrane)" stroke-width="4"/></g>
 <g class="org" data-org="rer">${rer}</g>
 <g class="org" data-org="rel"><path class="shape" d="M52,152 q8,-8 16,0 t16,0 t16,0" fill="none" stroke="var(--c-re)" stroke-width="3.4" stroke-linecap="round"/><path class="shape" d="M56,163 q8,-8 16,0 t16,0 t14,0" fill="none" stroke="var(--c-re)" stroke-width="3.4" stroke-linecap="round"/></g>
 <g class="org" data-org="noyau"><circle class="shape" cx="${cx}" cy="${cy}" r="34" fill="var(--c-nucleus-fill)" stroke="var(--c-nucleus)" stroke-width="3"/><circle cx="${cx-6}" cy="${cy+4}" r="9" fill="var(--c-nucleus)" opacity=".55"/></g>
 ${golgiShape(228,52)}
 ${mitoShape(84,80,-25)}${mitoShape(246,160,25)}${mitoShape(110,188,8)}
 ${lysoShape(60,124)}${lysoShape(200,200)}${lysoShape(268,112)}
 <g class="org" data-org="centro" transform="translate(150 176)"><rect class="shape" x="-8" y="-3" width="16" height="6" rx="2" fill="var(--surface)" stroke="var(--c-centro)" stroke-width="2"/><rect class="shape" x="5" y="-1" width="6" height="14" rx="2" fill="var(--surface)" stroke="var(--c-centro)" stroke-width="2"/></g>
 </svg>`;}

 return `<svg viewBox="0 0 320 240" role="img" aria-label="Schéma d’une cellule végétale">

 <g class="org" data-org="membrane"><rect class="shape" x="19" y="19" width="282" height="202" rx="10" fill="var(--c-pcyto)" stroke="var(--c-membrane)" stroke-width="2.4"/></g>
 <g class="org" data-org="vacuole"><rect class="shape" x="88" y="58" width="190" height="128" rx="42" fill="var(--c-vac)" stroke="var(--c-vac-stroke)" stroke-width="2.4"/></g>
 <g class="org" data-org="noyau"><circle class="shape" cx="52" cy="120" r="24" fill="var(--c-nucleus-fill)" stroke="var(--c-nucleus)" stroke-width="2.6"/><circle cx="48" cy="123" r="7" fill="var(--c-nucleus)" opacity=".55"/></g>
 ${chloroShape(110,38,0)}${chloroShape(175,38,0)}${chloroShape(238,38,0)}${chloroShape(290,120,90)}${chloroShape(130,203,0)}${chloroShape(205,203,0)}${chloroShape(46,188,-35)}${chloroShape(46,54,35)}
 ${mitoShape(282,36,0,.55)}${mitoShape(268,204,0,.55)}
 </svg>`;}
function svgBilayer(){
 let s='';const prot=[[96,140],[232,266]];
 const inProt=x=>prot.some(([a,b])=>x>a-6&&x<b+6);
 for(let x=14;x<=320;x+=12){ if(inProt(x)) continue;
  s+=`<path d="M${x-2},46 L${x-3},70 M${x+2},46 L${x+3},70" stroke="var(--c-membrane)" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="${x}" cy="40" r="5.5" fill="var(--c-membrane)"/>`;
  s+=`<path d="M${x-2},104 L${x-3},80 M${x+2},104 L${x+3},80" stroke="var(--c-membrane)" stroke-width="1.5" fill="none" stroke-linecap="round"/><circle cx="${x}" cy="110" r="5.5" fill="var(--c-membrane)"/>`;}
 return `<svg viewBox="0 0 334 160" role="img" aria-label="Bicouche de phospholipides traversée par des protéines">
 <text x="4" y="16" class="svgt">extérieur de la cellule</text><text x="4" y="152" class="svgt">intérieur (cytoplasme)</text>
 ${s}
 <ellipse cx="118" cy="75" rx="24" ry="50" fill="var(--c-mito-fill)" stroke="var(--c-mito)" stroke-width="2.2"/>
 <ellipse cx="249" cy="75" rx="19" ry="46" fill="var(--c-mito-fill)" stroke="var(--c-mito)" stroke-width="2.2"/>
 <ellipse cx="186" cy="124" rx="14" ry="9" fill="var(--c-mito-fill)" stroke="var(--c-mito)" stroke-width="2"/>
 <text x="118" y="79" text-anchor="middle" class="svgb" style="font-size:10px">protéine</text>
 </svg>`;}
function svgATP(){
 return `<svg viewBox="0 0 320 140" role="img" aria-label="Cycle ADP ATP">
 <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="var(--accent)"/></marker>
 <marker id="ah2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10z" fill="var(--c-re)"/></marker></defs>
 <rect x="12" y="50" width="96" height="40" rx="12" fill="var(--surface-2)" stroke="var(--line)"/><text x="60" y="75" text-anchor="middle" class="svgb">ADP + P</text>
 <rect x="212" y="50" width="96" height="40" rx="12" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="260" y="75" text-anchor="middle" class="svgb" style="font-weight:700">ATP</text>
 <path d="M100,48 Q160,6 220,48" fill="none" stroke="var(--accent)" stroke-width="2.4" marker-end="url(#ah)"/>
 <text x="160" y="20" text-anchor="middle" class="svgt">+ E (respiration, mitochondrie)</text>
 <path d="M220,92 Q160,134 100,92" fill="none" stroke="var(--c-re)" stroke-width="2.4" marker-end="url(#ah2)"/>
 <text x="160" y="134" text-anchor="middle" class="svgt">libère E (on utilise de l’eau)</text>
 </svg>`;}
function svgGolgi(){
 let p='';for(let i=0;i<5;i++){p+=`<path d="M${100+i*3},${40+i*14} Q160,${24+i*14} ${220-i*3},${40+i*14}" fill="none" stroke="var(--c-golgi)" stroke-width="7" stroke-linecap="round"/>`;}
 const v=[[236,44,6],[250,62,5],[236,90,5.5],[84,60,5],[80,96,6]];
 v.forEach(([x,y,r])=>p+=`<circle cx="${x}" cy="${y}" r="${r}" fill="var(--c-lyso-fill)" stroke="var(--c-golgi)" stroke-width="2"/>`);
 return `<svg viewBox="0 0 320 130" role="img" aria-label="Dictyosome et vésicules">${p}
 <text x="160" y="118" text-anchor="middle" class="svgt">dictyosome : sacs aplatis empilés</text>
 <text x="262" y="96" class="svgt">vésicules</text></svg>`;}
const DIAGRAMS={animal:svgAnimal,plant:svgPlant,bilayer:svgBilayer,atp:svgATP,golgi:svgGolgi};
const CELL_ORGS={animal:['membrane','noyau','mito','rer','rel','golgi','lyso','centro'],plant:['paroi','membrane','vacuole','chloro','noyau','mito']};

const SECTIONS={
organisation:{keys:['Toute cellule = membrane + cytoplasme + noyau.','Une bactérie est une cellule.','Un virus n’est pas une cellule : il ne peut pas se reproduire tout seul.'],html:()=>`
<p class="muted">La cellule animale. Toute cellule, quelle qu’elle soit, est organisée de la même façon.</p>
<div class="box key"><span class="eyebrow">Organisation générale</span>Une cellule comprend trois parties :
<ul style="margin-top:6px"><li><b>la membrane</b> (cellulaire, cytoplasmique ou plasmique : ce sont trois noms pour la même chose) ;</li><li><b>le cytoplasme</b> ;</li><li><b>le noyau</b>.</li></ul></div>
<div class="figure" data-cell="animal"></div>
<h3>Cellule ou pas cellule ?</h3>
<ul><li><b>Bactérie</b> → c’est une cellule.</li><li><b>Virus</b> → ne peut pas se reproduire tout seul : il a du matériel génétique, mais il a besoin d’une cellule pour se multiplier.</li></ul>
<div class="box warn"><span class="eyebrow">Consigne du prof</span>Savoir <b>reconnaître</b> les organites, les <b>schématiser</b> (à peu près), connaître leurs <b>rôles</b> et les <b>types de tissus / cellules</b> où on les trouve en grand nombre.</div>`},
membrane:{keys:['Structure en « mosaïque fluide ».','Bicouche de phospholipides + protéines dispersées.','Replis → plus de surface de contact et d’échanges.','Rôle : relations avec l’extérieur, perméabilité sélective.','Reliée au cytosquelette (maintien / transport).'],html:()=>`
<p>Toute cellule est enveloppée d’une membrane. Sa structure est bien déterminée : on parle de <b>« mosaïque fluide »</b>. Elle est formée de <b>protéines</b> dispersées et immergées dans une <b>double couche de phospholipides</b>.</p>
<div class="box key"><span class="eyebrow">Définition</span>Une bicouche de phospholipides dans laquelle s’intègrent différentes familles de molécules. C’est vrai pour <b>toutes</b> les membranes cellulaires.</div>
<div class="figure"><div data-diagram="bilayer"></div><div class="figcap">Têtes <b>hydrophiles</b> (aiment l’eau) tournées vers l’extérieur et l’intérieur ; queues <b>hydrophobes</b> (fuient l’eau) cachées au centre.</div></div>
<h3>Une membrane qui fait des replis</h3>
<p>La membrane n’est pas tendue autour de la cellule. Elle forme des replis pour :</p>
<ul><li>augmenter la <b>surface de contact</b> ;</li><li>augmenter les <b>échanges</b> possibles.</li></ul>
<h3>Rôle</h3>
<p>Assurer les <b>relations avec le monde extérieur</b> tout en présentant une <b>perméabilité sélective</b> : elle choisit ce qui entre et ce qui sort.</p>
<div class="box"><span class="eyebrow">Le cytosquelette</span>Sur sa face intérieure, la membrane est reliée aux fibres du <b>cytosquelette</b> : un réseau de fibres protéiques qui sert au <b>maintien</b> et au <b>transport</b>.</div>`},
cytoplasme:{keys:['Cytoplasme = tout ce qui est dans la membrane, sauf le noyau.','Cytoplasme = hyaloplasme (cytosol) + organites.','Hyaloplasme : transparent, fluide, incolore, élastique, visqueux.','Riche en eau + glucides, sels minéraux, acides aminés, O₂, CO₂.'],html:()=>`
<p>On appelle <b>cytoplasme</b> la masse de substance comprise à l’intérieur de la membrane, <b>à l’exclusion du noyau</b>.</p>
<div class="box key"><span class="eyebrow">À retenir</span>Cytoplasme = ensemble formé par les <b>organites cellulaires</b> et le <b>cytosol</b> (aussi appelé <b>hyaloplasme</b>).</div>
<div class="box warn"><span class="eyebrow">Attention (p. 53)</span>La majorité des cellules sont organisées comme ça.</div>
<h3>Composition du cytoplasme</h3>
<div class="tbl"><table><tr><th>Hyaloplasme</th><th>Organites cellulaires</th></tr>
<tr><td>la substance de base</td><td>mitochondries · centrosomes · lysosomes · ribosomes · réticulum endoplasmique · appareil de Golgi</td></tr></table></div>
<h3>Le hyaloplasme</h3>
<p>Ses 5 caractéristiques :</p>
<div class="tags"><span class="tag">transparent</span><span class="tag">fluide</span><span class="tag">incolore</span><span class="tag">élastique</span><span class="tag">visqueux</span></div>
<p><b>Composition :</b> riche en ${H2O} et en substances dissoutes dans l’eau : <b>glucides, sels minéraux, acides aminés (AA), ${O2}, ${CO2}</b>.</p>
<div class="box"><span class="eyebrow">Astuce mémo</span>« Ta Fille Invite Elsa Volontiers » → Transparent, Fluide, Incolore, Élastique, Visqueux.</div>`},
mitochondries:{keys:['Forme : corpuscule allongé, cylindrique, arrondi aux bouts, avec des crêtes.','Rôle : respiration cellulaire → « centrale énergétique ».','Glucose + 6 O₂ → 6 CO₂ + 6 H₂O + E.','L’énergie est stockée dans l’ATP : ADP + P + E ⇄ ATP.','R + E → P : endothermique ; R → P + E : exothermique.','Riches en mitochondries : cœur, muscles, reins, foie.'],html:()=>`
<ul><li><b>Structure :</b> corpuscule allongé, plus ou moins cylindrique, arrondi aux extrémités, avec des <b>crêtes</b> internes.</li><li><b>Rôle :</b> la <b>respiration cellulaire</b>.</li></ul>
<h3>La respiration cellulaire</h3>
<div class="flow"><div class="fbx"><b>Entrées</b>${G} + ${O2}</div><div class="arr">→</div><div class="fbx mid"><b>Mitochondrie</b>avec crêtes internes</div><div class="arr">→</div><div class="fbx"><b>Sorties</b>${CO2} + ${H2O} + E</div></div>
<div class="eq">${G} + 6 ${O2} → 6 ${CO2} + 6 ${H2O} + E</div>
<div class="tbl"><table><tr><th>Réaction</th><th>Type</th></tr><tr><td>R + E → P</td><td><b>endothermique</b> (absorbe de l’énergie)</td></tr><tr><td>R → P + E</td><td><b>exothermique</b> (libère de l’énergie)</td></tr></table></div>
<p class="muted" style="font-size:14px">La respiration libère de l’énergie : c’est une réaction exothermique.</p>
<h3>Le cycle ADP / ATP</h3>
<div class="figure"><div data-diagram="atp"></div><div class="figcap">ADP (adénosine diphosphate) + P + E ⇄ ATP</div></div>
<ul><li>On qualifie la mitochondrie de <b>« centrale énergétique de la cellule »</b> car elle produit l’ATP nécessaire aux réactions cellulaires.</li><li>C’est dans l’<b>ATP</b> qu’est stockée et transportée l’énergie qui vient de la respiration.</li></ul>
<div class="box key"><span class="eyebrow">Utilisation de l’ATP</span>On utilise de l’<b>eau</b> pour détacher un P : ATP → ADP + P + E.</div>
<h3>Rôles des mitochondries</h3>
<ul><li>permettre l’<b>oxydation des aliments</b> ;</li><li>siège de la <b>respiration cellulaire</b> ;</li><li><b>centrales énergétiques</b> de la cellule.</li></ul>
<div class="box"><span class="eyebrow">Cellules riches en mitochondries</span>cœur · muscles squelettiques · reins · foie. Ce sont des organes qui consomment beaucoup d’énergie.</div>`},
reticulum:{keys:['Feuillets très minces reliés à la membrane plasmique et à celle du noyau.','RE lisse (REL) : pas de ribosomes → synthèse des lipides.','RE rugueux (RER) : couvert de ribosomes → synthèse des protéines.','Ribosomes : assemblent les acides aminés en protéines.','Citerne : espace entre deux feuillets, réseau de circulation.'],html:()=>`
<p>Ensemble de <b>feuillets très minces</b> formant dans le cytoplasme de nombreux replis. Ces feuillets sont en liaison avec la <b>membrane plasmique</b> et celle du <b>noyau</b>.</p>
<div class="tbl"><table><tr><th></th><th>RE lisse (REL)</th><th>RE rugueux (RER)</th></tr>
<tr><td><b>Ribosomes</b></td><td class="no">non</td><td class="yes">oui, sur la face externe</td></tr>
<tr><td><b>Fabrique</b></td><td>des <b>lipides</b>, grâce aux enzymes de sa membrane</td><td>des <b>protéines</b></td></tr></table></div>
<h3>Le RER et les ribosomes</h3>
<ul><li>Les <b>ribosomes</b> fabriquent les protéines en <b>assemblant des acides aminés</b>.</li><li>C’est là que sont synthétisées les protéines dont la cellule est constituée, et celles qu’elle envoie vers l’extérieur.</li><li>Le RER aide les protéines à se <b>replier</b>, les <b>modifie</b> et <b>contrôle leur qualité</b>.</li></ul>
<div class="box key"><span class="eyebrow">Vocabulaire</span>L’espace compris entre deux feuillets s’appelle une <b>citerne</b>. Les citernes forment un vaste <b>réseau de circulation</b>.</div>
<div class="box"><span class="eyebrow">Astuce mémo</span><b>R</b>ugueux = <b>R</b>ibosomes = p<b>R</b>otéines. <b>L</b>isse = <b>L</b>ipides.</div>`},
golgi:{keys:['Constitué d’un ou plusieurs dictyosomes.','Dictyosome = petits sacs très aplatis empilés.','Les bords forment des vésicules remplies de produits de synthèse.','Surnom : « organe d’emballage » de la cellule.','Très présent dans les cellules des glandes.'],html:()=>`
<p>L’appareil de Golgi est constitué d’un ou plusieurs <b>dictyosomes</b>.</p>
<div class="figure"><div data-diagram="golgi"></div><div class="figcap">Les bords se gonflent puis se détachent (bourgeonnement) en vésicules.</div></div>
<ul><li><b>Dictyosome</b> = ensemble de petits sacs très aplatis empilés les uns sur les autres.</li><li>Les bords des dictyosomes se gonflent et se fragmentent en petites <b>vésicules</b> remplies de <b>produits de synthèse</b>.</li></ul>
<div class="box key"><span class="eyebrow">À retenir</span>Appareil de Golgi = <b>organe d’emballage</b> de la cellule.</div>
<h3>Où en trouve-t-on beaucoup ?</h3>
<p>Dans les cellules des <b>glandes</b>, qui fabriquent et exportent beaucoup de produits :</p>
<div class="tags"><span class="tag">salivaires</span><span class="tag">lacrymales</span><span class="tag">sudoripares</span><span class="tag">testicules</span><span class="tag">ovaires</span><span class="tag">pancréas</span><span class="tag">thyroïde</span><span class="tag">séminales</span><span class="tag">surrénales (adrénaline)</span></div>
<div class="box warn"><span class="eyebrow">Ne pas confondre</span>Les <b>cellules musculaires</b>, elles, sont riches en <b>mitochondries</b>.</div>`},
lysosomes:{keys:['Surnom : « poubelles de la cellule ».','Contiennent de nombreuses enzymes.','Décomposent les matières alimentaires et les corps étrangers.','Les enzymes viennent des ribosomes.','Forme très sphérique.'],html:()=>`
<div class="box key"><span class="eyebrow">Surnom</span>Les <b>« poubelles de la cellule »</b>.</div>
<ul><li>Organite situé dans le <b>cytoplasme</b>.</li><li>Contient de nombreuses <b>enzymes</b> capables de provoquer la <b>décomposition</b> des matières alimentaires et des <b>corps étrangers</b> qui ont pénétré dans la cellule.</li><li>Origine des enzymes → les <b>ribosomes</b> (les enzymes sont des protéines).</li><li>Forme <b>très sphérique</b>.</li></ul>
<div class="figure" data-cell="animal" data-focus="lyso"></div>`},
vegetale:{keys:['Tous les organites de la cellule animale, plus 3 en propre.','Enveloppe : résistante, non vivante, rigide, élastique.','Chloroplastes : chlorophylle → photosynthèse à la lumière.','6 CO₂ + 6 H₂O → 6 O₂ + C₆H₁₂O₆.','Vacuoles : eau + sels minéraux + glucides simples → rigidité et élasticité.'],html:()=>`
<p>La cellule végétale a de nombreux points communs avec la cellule animale, mais elle possède des constituants qui lui sont propres.</p>
<div class="figure" data-cell="plant"></div>
<h3>1) L’enveloppe</h3>
<p>La membrane de la cellule végétale est presque toujours renforcée par une enveloppe :</p>
<div class="tags"><span class="tag">résistante</span><span class="tag">non vivante</span><span class="tag">rigide</span><span class="tag">élastique</span></div>
<h3>2) Les chloroplastes</h3>
<ul><li>Organites <b>aplatis</b>, remplis en couches régulières de nombreuses molécules de <b>chlorophylle</b>.</li><li>Rendue active par la <b>lumière</b>, la chlorophylle réalise une succession de réactions : la <b>photosynthèse</b>.</li></ul>
<div class="eq">6 ${CO2} + 6 ${H2O} ⇄ 6 ${O2} + ${G}</div>
<div class="box"><span class="eyebrow">Remarque</span>La photosynthèse, c’est la respiration « à l’envers » : les produits de l’une sont les réactifs de l’autre.</div>
<h3>3) Les vacuoles</h3>
<ul><li>Remplies d’un liquide : de l’<b>eau</b> dans laquelle sont dissous des <b>sels minéraux</b> et des <b>glucides simples</b>.</li><li>Les plantes leur doivent leur <b>rigidité</b> et leur <b>élasticité</b>.</li></ul>
<div class="box plant"><span class="eyebrow">À retenir</span>La cellule végétale possède <b>tous les organites de la cellule animale</b>, plus l’enveloppe, les chloroplastes et les vacuoles.</div>
<h3>Comparaison</h3>
<div class="tbl"><table><tr><th>Constituant</th><th>Animale</th><th>Végétale</th></tr>
<tr><td>Membrane, cytoplasme, noyau</td><td class="yes">oui</td><td class="yes">oui</td></tr>
<tr><td>Mitochondries</td><td class="yes">oui</td><td class="yes">oui</td></tr>
<tr><td>Enveloppe (paroi)</td><td class="no">non</td><td class="yes">oui</td></tr>
<tr><td>Chloroplastes</td><td class="no">non</td><td class="yes">oui</td></tr>
<tr><td>Grandes vacuoles</td><td class="no">non</td><td class="yes">oui</td></tr></table></div>`}
};

/* ---------- state ---------- */
const KEY='revise-cellule-v1';
let memo=null;
function fresh(){return {q:{},r:{},n:{},xp:0,streak:0,best:0,lastDay:null,read:{},hist:[],days:{},len:10,tot:0,ok:0,chests:[],col:{},themes:['rose'],theme:'rose',shield:0,sm:{},dq:null,rem:{on:false,time:'18:00',last:null},exam:null};}
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return memo;}
let S=Object.assign(fresh(),load()||{});
function save(quiet){if(!quiet)S.ts=Date.now();memo=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}if(!quiet)queueCloud();}
/* cloud save: progression kept in the viewer's Claude account */
var cloud=null,cloudT=null,cloudBusy=false,cloudAgain=false,cloudReady=false,syncState='wait';
const SYNC={wait:'Connexion à ta sauvegarde…',ok:'Progression sauvegardée dans ton compte Claude : tu la retrouves à chaque ouverture, sur tous tes appareils.',local:'Progression enregistrée sur cet appareil. Ouvre toujours l’app avec le même navigateur (ou depuis l’icône sur ton écran d’accueil).',slow:'La sauvegarde en ligne ne répond pas encore… on réessaie.',err:'Impossible de sauvegarder en ligne pour l’instant. Ta progression est gardée sur cet appareil et sera envoyée dès que possible.'};
function setSync(st){syncState=st;const el=document.getElementById('sync');if(el){el.textContent=SYNC[st];el.className='sync '+st;}}
function queueCloud(){if(!cloud||!cloudReady)return;clearTimeout(cloudT);cloudT=setTimeout(pushCloud,1200);}
async function pushCloud(){if(!cloud)return;if(cloudBusy){cloudAgain=true;return;}cloudBusy=true;
 try{await cloud.set({state:JSON.stringify(S),ts:S.ts||Date.now(),v:1});setSync('ok');}
 catch(e){setSync(e&&e.code==='invalid_argument'?'local':'err');if(e&&e.code==='unavailable')setTimeout(queueCloud,4000);}
 cloudBusy=false;if(cloudAgain){cloudAgain=false;pushCloud();}}
function isEmpty(x){return !x||(!x.tot&&!x.xp&&!Object.keys(x.read||{}).length&&!(x.chests||[]).length);}
async function initCloud(){
 try{if(!window.claude||typeof claude.use!=='function'){setSync('local');return;}
  const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
  if(!db||!user){setSync('local');return;}
  const id=await user.id();if(!id){setSync('local');return;}
  cloud=db.doc('data/users/'+id+'/progress');
  const timer=setTimeout(()=>setSync('slow'),10000);
  let snap;try{snap=await cloud.get();}catch(e){try{await new Promise(r=>setTimeout(r,800+Math.random()*800));snap=await cloud.get();}catch(e2){clearTimeout(timer);cloudReady=true;setSync('err');return;}}
  clearTimeout(timer);
  let r=null;if(snap.exists){try{r=JSON.parse(snap.data().state);}catch(e){}}
  cloudReady=true;
  if(r&&(isEmpty(S)||(r.ts||0)>=(S.ts||0))){
   S=Object.assign(fresh(),r);memo=S;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
   applyTheme();if(!sess)render();else renderChrome();setSync('ok');
   if(!isEmpty(r))toast('Progression récupérée');}
  else if(!isEmpty(S))pushCloud();
  else setSync('ok');
 }catch(e){setSync('err');}
}
const dayKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function touchDay(){const t=dayKey();if(S.lastDay===t)return;const y=new Date();y.setDate(y.getDate()-1);const y2=new Date();y2.setDate(y2.getDate()-2);
 if(S.lastDay===dayKey(y))S.streak++;else if(S.lastDay===dayKey(y2)&&S.shield>0){S.shield--;S.streak++;toast('Bouclier utilisé : ta série est sauvée !');}else S.streak=1;
 S.best=Math.max(S.best,S.streak);S.lastDay=t;
 [3,7,14,30].forEach(n=>{if(S.streak>=n&&!S.sm[n]){S.sm[n]=1;giveChest(n>=7?'or':'argent',`Série de ${n} jours`);}});}
function liveStreak(){if(!S.lastDay)return 0;const y=new Date();y.setDate(y.getDate()-1);const y2=new Date();y2.setDate(y2.getDate()-2);return (S.lastDay===dayKey()||S.lastDay===dayKey(y)||(S.shield>0&&S.lastDay===dayKey(y2)))?S.streak:0;}

/* ---------- adaptive engine ---------- */
const DV={1:-0.6,2:0.6,3:1.7};
const INT=[0,10*60e3,864e5,3*864e5,7*864e5,16*864e5];
const rating=t=>S.r[t]??0;
function mastery(t,r=S.r,n=S.n){if(!n[t])return 0;return Math.round(100*sig(((r[t]??0)-0.9)*1.5));}
function target(t){const r=rating(t);return r<0.2?1:r<1.3?2:3;}
function level(m,n){if(!n)return['À découvrir','p-new'];if(m<40)return['Fragile','p-weak'];if(m<75)return['En progrès','p-mid'];return['Maîtrisé','p-ok'];}
function globalMastery(){return Math.round(TOPICS.reduce((s,t)=>s+mastery(t.id),0)/TOPICS.length);}
function record(q,score){
 const t=q.t,r=rating(t),p=sig(r-DV[q.d]);
 S.r[t]=Math.max(-2,Math.min(4,r+0.55*(score-p)));
 S.n[t]=(S.n[t]||0)+1;
 const st=S.q[q.id]||(S.q[q.id]={b:0,c:0,w:0,due:0});
 if(score>=0.999){st.c++;st.b=Math.min(5,st.b+1);}
 else if(score>=0.5){st.w++;st.b=Math.max(1,st.b);}
 else{st.w++;st.b=1;}
 st.due=Date.now()+(score>=0.999?INT[st.b]:INT[1]);
 const k=dayKey();S.days[k]=(S.days[k]||0)+1;S.tot++;if(score>=0.999)S.ok++;
 const L0=lvlInfo().L;S.xp+=score>=0.999?10:3;touchDay();save();checkMissions();if(lvlInfo().L>L0)toast(`Niveau ${lvlInfo().L} atteint !`);
}
function weakest(n=3){return TOPICS.map(t=>({...t,m:mastery(t.id),c:S.n[t.id]||0})).filter(t=>t.c>0).sort((a,b)=>a.m-b.m).slice(0,n);}
function errorsPool(){return QS.filter(q=>{const s=S.q[q.id];return s&&s.w>0&&(s.b<3||s.w>=s.c);});}
function duePool(){const now=Date.now();return QS.filter(q=>S.q[q.id]&&S.q[q.id].due<=now);}

let sess=null;
function pick(){
 const ri=sess.requeue.findIndex(x=>x.at<=sess.log.length);
 if(ri>=0){const r=sess.requeue.splice(ri,1)[0];return{q:QMAP[r.id],again:true};}
 const pool=sess.pool.filter(q=>!sess.used.has(q.id));
 if(!pool.length){if(sess.requeue.length){const r=sess.requeue.shift();return{q:QMAP[r.id],again:true};}return null;}
 const now=Date.now(),last=sess.log.slice(-2).map(l=>QMAP[l.id]);
 let best=null,bs=-1e9;
 for(const q of pool){const st=S.q[q.id];let s=0;
  s+=2-1.3*Math.abs(q.d-target(q.t));
  s+=(1-mastery(q.t)/100)*2.2;
  if(!st)s+=0.8;else if(st.due<=now)s+=1.8+(st.w>st.c?1:0);else s-=2.2;
  if(last.length&&last[last.length-1].t===q.t)s-=1.2;
  if(last.length===2&&last.every(x=>x.t===q.t))s-=1.5;
  if(last.length&&last[last.length-1].type===q.type)s-=0.6;
  s+=Math.random()*1.3;
  if(s>bs){bs=s;best=q;}}
 return{q:best};
}
function buildExam(){let list=[];for(const t of TOPICS){const qs=shuffle(QS.filter(q=>q.t===t.id));
 const a=qs.find(q=>q.d<=2),b=qs.find(q=>q.d>=2&&q!==a);list.push(a,b);}return shuffle(list.filter(Boolean));}

function start(mode,topic){

 let pool,len=S.len;
 if(mode==='topic'){pool=QS.filter(q=>q.t===topic);len=Math.min(8,pool.length);S.read[topic]=1;save();}
 else if(mode==='errors'){pool=errorsPool();if(!pool.length){toast('Aucune erreur à revoir. Lance une session intelligente !');return;}len=Math.min(len,pool.length);}
 else if(mode==='schema'){pool=QS.filter(q=>q.type==='diagram');len=Math.min(10,pool.length);}
 else pool=QS.slice();
 sess={mode,topic,len,pool,used:new Set(),requeue:[],log:[],startR:{...S.r},startN:{...S.n},cur:null,done:false};
 if(mode==='exam'){sess.list=buildExam();sess.len=sess.list.length;}
 openLayer();next();
}

function closeLayer(){const z=$('#quiz');z.hidden=true;z.innerHTML='';document.body.style.overflow='';sess=null;render();}
function realCount(){return sess.log.filter(l=>!l.again).length;}
function next(){
 const real=realCount();let item;
 if(sess.mode==='exam'){if(real>=sess.len)return finish();item={q:sess.list[real]};}
 else{if(real>=sess.len){if(!sess.requeue.length)return finish();const r=sess.requeue.shift();item={q:QMAP[r.id],again:true};}
  else item=pick();
  if(!item)return finish();}
 sess.used.add(item.q.id);
 sess.cur={...item,start:Date.now()};
 renderQ();
}

 </div></div>`;

 ({mcq:rMCQ,tf:rTF,multi:rMulti,input:rInput,match:rMatch,diagram:rDiagram})[q.type](q,body);

const DAYMS=864e5;
const JOURS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const parseDay=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
function nextThu(){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+(4-d.getDay()+7)%7);return dayKey(d);}
if(!S.exam){S.exam=nextThu();save(true);}
function daysLeft(){const t=new Date();t.setHours(0,0,0,0);return Math.round((parseDay(S.exam)-t)/DAYMS);}

function calcGoal(){const dl=daysLeft();if(dl===0)return 10;if(dl<0)return 20;
 const left=QS.filter(q=>!(S.q[q.id]&&S.q[q.id].b>=2)).length;return Math.max(15,Math.min(30,Math.ceil(left/dl)+5));}
function dq(){const t=dayKey();if(!S.dq||S.dq.d!==t)S.dq={d:t,f:{},got:{},g:calcGoal()};return S.dq;}
function dayTheme(dl){return dl>=4?'Découverte':dl===3?'Points faibles':dl===2?'Erreurs & mémo':dl===1?'Examen blanc':dl===0?'Jour J':'Révision';}
function missions(){
 const dl=daysLeft(),q=dq(),f=q.f,today=S.days[dayKey()]||0;let m2,m3;
 if(dl>=4)m3={id:'topic',label:Object.keys(S.read).length<TOPICS.length?'Lire un chapitre, puis faire ses questions':'Faire une série « par chapitre »',go:'#cours'};
 else if(dl===3)m3={id:'topic',label:'Travailler ton chapitre le plus faible',start:'weak'};
 else if(dl===1)m3={id:'exam',label:'Faire l’examen blanc (vise 14/20)',start:'exam'};
 else m3={id:'cards',label:dl===0?'Échauffement : une série de cartes mémo':'Faire une série de cartes mémo',start:'cards'};
 if((dl===2||dl===0)&&(errorsPool().length||f.errors))m2={id:'errors',label:'Revoir toutes tes erreurs',start:'errors'};
 else m2={id:'s70',label:'Finir une session à 70 % ou plus',start:'smart'};
 const list=[{id:'goal',label:`Répondre à ${q.g} questions`,prog:`${Math.min(today,q.g)}/${q.g}`,start:'smart',done:today>=q.g},m2,m3];

}
